<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VUVA Clubs</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="top">
    <div class="wrap navbar">
      <div class="logo"><span class="l-v1">V</span><span class="l-u">U</span><span class="l-v2">V</span><span class="l-a">A</span></div>
        <nav class="links">
  <a href="index.html" class="active">Home</a>
  <a href="table.html">Table</a>
  <a href="clubs.html">Clubs</a>
  <a href="players.html">Players</a>
  <a href="fixtures.html">Fixtures</a>
  <a href="market.html">Market Value</a>
  <a href="news.html">News</a>
  <a href="statistics.html">Statistics</a>
</nav>
    </div>
  </header>
  <main class="wrap" style="padding: 60px 24px 80px;">
    <div class="page-head">
      <div>
        <h2 class="section-title" style="margin-bottom:6px;">Clubs</h2>
        <p class="section-sub" style="margin-bottom:0;">A concise view of every club</p>
      </div>
      <div class="search-shell">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input id="club-search" type="text" placeholder="Search clubs by name, city, country..." autocomplete="off" />
      </div>
    </div>
    <div class="club-grid" id="clubs-grid"></div>
  </main>
  <script src="api.js"></script>
  <script>
    const AVATAR_COLORS = ['#007A4D', '#FFB612', '#DE3831', '#001489'];

    function avatarColor(name) {
      let hash = 0;
      for (let i = 0; i < name.length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
      return AVATAR_COLORS[Math.abs(hash) % AVATAR_COLORS.length];
    }

    function initials(name) {
      return name.split(/\s+/).filter(Boolean).slice(0, 2).map((w) => w[0].toUpperCase()).join('');
    }


function formatRand(marketValueRands) {
  if (marketValueRands === null || marketValueRands === undefined) return null;

  const rand = Number(marketValueRands);
  const abs = Math.abs(rand);

  if (abs >= 1e9) return `R${(rand / 1e9).toFixed(1)}bn`;
  if (abs >= 1e6) return `R${(rand / 1e6).toFixed(1)}m`;
  if (abs >= 1e3) return `R${(rand / 1e3).toFixed(0)}k`;

  return `R${rand.toLocaleString('en-ZA')}`;
}
    function clubLogo(team) {
      if (team.logo_url) {
        return `<img class="club-logo-img" src="${team.logo_url}" alt="${team.name} logo"
                  onerror="this.outerHTML = '<div class=\\'club-logo-fallback\\' style=\\'background:${avatarColor(team.name)}\\'>${initials(team.name)}</div>'" />`;
      }
      return `<div class="club-logo-fallback" style="background:${avatarColor(team.name)}">${initials(team.name)}</div>`;
    }

    function coachName(team) {
      if (!team.coach) return null;
      const name = [team.coach.first_name, team.coach.last_name].filter(Boolean).join(' ');
      return name || null;
    }

    function captainName(team) {
  if (!team.captain) return null;

  return [
    team.captain.first_name,
    team.captain.last_name
  ]
    .filter(Boolean)
    .join(' ');
}

function statRow(label, value) {
  if (!value) return '';
  return `<li><span class="club-stat-label">${label}</span><span class="club-stat-value">${value}</span></li>`;
}

    let allTeams = [];

    function renderClubs(teams) {
      const grid = document.getElementById('clubs-grid');
      if (!teams.length) {
        grid.innerHTML = '<div class="empty-state" style="grid-column:1/-1;"><div class="news-head">No clubs match your search</div><p class="news-body">Try a different name, city, or country.</p></div>';
        return;
      }
      grid.innerHTML = teams.map((team) => `
        <article class="club-card">
          <div class="club-card-top">
            ${clubLogo(team)}
            <div>
              <div class="club-name">${team.name}</div>
              <div class="club-loc">${[team.city, team.country].filter(Boolean).join(', ') || 'Location unknown'}</div>
            </div>
          </div>
          <ul class="club-stats">
            ${statRow('Coach', coachName(team))}
            ${statRow('Captain',captainName(team))}
            ${statRow('Stadium', team.stadium)}
            ${statRow('Founded', team.founded_year)}
            ${statRow('Market value', formatRand(team.market_value_rands))}
            ${statRow('Squad rating', team.average_rating ? Number(team.average_rating).toFixed(1) : null)}
          </ul>
          ${team.website ? `<a class="club-link" href="${team.website}" target="_blank" rel="noopener">Official site &rarr;</a>` : ''}
        </article>
      `).join('');
    }

    function matchesQuery(team, query) {
      const haystack = [team.name, team.short_name, team.city, team.country, team.stadium, coachName(team)].filter(Boolean).join(' ').toLowerCase();
      return haystack.includes(query);
    }

    async function loadClubs() {
      const grid = document.getElementById('clubs-grid');
      try {
        allTeams = await apiGet('/teams/');
        if (!allTeams.length) {
          grid.innerHTML = '<div class="detail-card"><div class="news-head">No clubs yet</div><p class="news-body">Add teams from the admin panel to populate this page.</p></div>';
          return;
        }
        renderClubs(allTeams);
      } catch (err) {
        grid.innerHTML = '<div class="detail-card"><div class="news-head">Backend offline</div><p class="news-body">Start the API with uvicorn main:app --reload to load clubs.</p></div>';
      }
    }

    document.getElementById('club-search').addEventListener('input', (event) => {
      const query = event.target.value.trim().toLowerCase();
      renderClubs(query ? allTeams.filter((team) => matchesQuery(team, query)) : allTeams);
    });

    loadClubs();
  </script>
</body>
</html>
