<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VUVA Clubs</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="top">
    <div class="wrap navbar">
      <div class="logo"><span class="l-v1">V</span><span class="l-u">U</span><span class="l-v2">V</span><span class="l-a">A</span></div>
      <nav class="links">
        <a href="vuva.html">Home</a>
        <a href="table.html">Table</a>
        <a href="fixtures.html">Fixtures</a>
        <a href="news.html">News</a>
        <a href="players.html">Players</a>
        <a href="market.html">Market Value</a>
        <a href="clubs.html" class="active">Clubs</a>
        <a href="statistics.html">Statistics</a>
        <a href="admin.html">Admin</a>
      </nav>
    </div>
  </header>
  <main class="wrap" style="padding: 60px 24px 80px;">
    <h2 class="section-title">Club intelligence</h2>
    <p class="section-sub">A concise view of every club in our own database, from title contenders to development projects.</p>
    <div class="card-grid" id="clubs-grid"></div>
  </main>
  <script src="api.js"></script>
  <script>
    async function loadClubs() {
      const grid = document.getElementById('clubs-grid');
      try {
        const teams = await apiGet('/teams/');
        if (!teams.length) {
          grid.innerHTML = '<div class="detail-card"><div class="news-head">No clubs yet</div><p class="news-body">Add teams from the admin panel to populate this page.</p></div>';
          return;
        }
        grid.innerHTML = teams.map((team) => `
          <article class="detail-card">
            <div class="news-tag">${team.city || team.country || 'Club'}</div>
            <div class="news-head">${team.name}</div>
            <p class="news-body">${team.stadium ? 'Plays at ' + team.stadium + '. ' : ''}${team.founded_year ? 'Founded ' + team.founded_year + '. ' : ''}${team.average_rating ? 'Average squad rating ' + team.average_rating + '.' : ''}</p>
          </article>
        `).join('');
      } catch (err) {
        grid.innerHTML = '<div class="detail-card"><div class="news-head">Backend offline</div><p class="news-body">Start the API with uvicorn main:app --reload to load clubs.</p></div>';
      }
    }
    loadClubs();
  </script>
</body>
</html>
