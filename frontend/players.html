<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VUVA Players</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="top">
    <div class="wrap navbar">
      <div class="logo"><span class="l-v1">V</span><span class="l-u">U</span><span class="l-v2">V</span><span class="l-a">A</span></div>
      <nav class="links">
        <a href="vuva.html">Home</a>
        <a href="table.html">Table</a>
        <a href="fixtures.html">Fixtures</a>
        <a href="news.html">News</a>
        <a href="players.html" class="active">Players</a>
        <a href="market.html">Market Value</a>
        <a href="clubs.html">Clubs</a>
        <a href="statistics.html">Statistics</a>
        <a href="admin.html">Admin</a>
      </nav>
    </div>
  </header>
  <main class="wrap" style="padding: 60px 24px 80px;">
    <h2 class="section-title">Player profiles</h2>
    <p class="section-sub">The league's players, their output and how the VUVA rating model — computed from our own data — sees them.</p>
    <div class="player-grid" id="player-grid"></div>
  </main>
  <script src="api.js"></script>
  <script>
    function bar(label, val) {
      return `<div class="skill-row"><div class="skill-label">${label}</div><div class="skill-bar"><div class="skill-fill" style="width:${val}%"></div></div><div class="skill-val">${val}</div></div>`;
    }
    async function loadPlayers() {
      const grid = document.getElementById('player-grid');
      try {
        const players = await apiGet('/players/');
        if (!players.length) {
          grid.innerHTML = '<div class="detail-card"><div class="news-head">No players yet</div><p class="news-body">Add players from the admin panel to populate this page.</p></div>';
          return;
        }
        grid.innerHTML = players.map((player) => `
          <div class="pcard">
            <div class="pcard-top">
              <div>
                <div class="pcard-name">${player.first_name} ${player.last_name}</div>
                <div class="pcard-role">${player.playing_position.toUpperCase()} — ${player.team_name || 'Unattached'}</div>
              </div>
              <div class="pcard-index">${player.overall_rating || '-'}</div>
            </div>
            <div class="pcard-body">
              ${bar('Form', Math.round(player.form_rating || 70))}
              ${bar('Potential', Math.round(player.potential_rating || 70))}
              ${bar('Goals', Math.min(99, (player.goals || 0) * 4 + 40))}
              ${bar('Value', Math.min(99, Math.round((player.market_value_eur || 0) / 150000)))}
            </div>
            <div class="pcard-foot"><span>VUVA Index</span><span>Value R${((player.market_value_eur || 0) * 20).toLocaleString()}</span></div>
          </div>
        `).join('');
      } catch (err) {
        grid.innerHTML = '<div class="detail-card"><div class="news-head">Backend offline</div><p class="news-body">Start the API with uvicorn main:app --reload to load players.</p></div>';
      }
    }
    loadPlayers();
  </script>
</body>
</html>
