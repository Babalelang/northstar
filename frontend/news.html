<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VUVA News</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="top">
    <div class="wrap navbar">
      <div class="logo"><span class="l-v1">V</span><span class="l-u">U</span><span class="l-v2">V</span><span class="l-a">A</span></div>
      <nav class="links">
        <a href="vuva.html">Home</a>
        <a href="table.html">Table</a>
        <a href="fixtures.html">Fixtures</a>
        <a href="news.html" class="active">News</a>
        <a href="players.html">Players</a>
        <a href="market.html">Market Value</a>
        <a href="clubs.html">Clubs</a>
        <a href="statistics.html">Statistics</a>
        <a href="admin.html">Admin</a>
      </nav>
    </div>
  </header>
  <main class="wrap" style="padding: 60px 24px 80px;">
    <h2 class="section-title">League coverage</h2>
    <p class="section-sub">More context, less noise — the stories that shape the season.</p>
    <div class="card-grid" id="news-grid">
      <p class="note">Loading news…</p>
    </div>
  </main>
  <script src="api.js"></script>
  <script>
    const TYPE_LABELS = {
      transfer: 'Transfer',
      general: 'General',
      match: 'Match',
      weather: 'Weather',
    };

    function timeAgo(dateStr) {
      if (!dateStr) return '';
      const diffMs = Date.now() - new Date(dateStr).getTime();
      const diffHrs = Math.floor(diffMs / 3600000);
      if (diffHrs < 1) return 'Just now';
      if (diffHrs < 24) return `${diffHrs}h ago`;
      const diffDays = Math.floor(diffHrs / 24);
      return `${diffDays}d ago`;
    }

    async function loadNews() {
      const grid = document.getElementById('news-grid');
      try {
        const announcements = await apiGet('/announcements/');

        if (!announcements.length) {
          grid.innerHTML = '<p class="note">No news yet — check back soon.</p>';
          return;
        }

        grid.innerHTML = announcements.map((a) => {
          const tag = TYPE_LABELS[a.announcement_type] || 'General';
          const pinned = a.is_pinned ? '<span class="news-pin">Pinned</span>' : '';
          const summary = a.summary || (a.body ? a.body.slice(0, 160) + '…' : '');
          const img = a.featured_image_url
            ? `<img src="${a.featured_image_url}" alt="" class="news-img" />`
            : '';
          return `
            <article class="detail-card">
              ${img}
              <div class="news-tag">${tag} ${pinned}</div>
              <div class="news-head">${a.title}</div>
              <p class="news-body">${summary}</p>
              <div class="news-meta">${timeAgo(a.published_at)}</div>
            </article>
          `;
        }).join('');
      } catch (err) {
        grid.innerHTML = '<p class="note">Could not reach the VUVA API. Start the backend with uvicorn main:app --reload.</p>';
      }
    }

    loadNews();
  </script>
</body>
</html>
