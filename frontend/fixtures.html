<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VUVA Fixtures</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="top">
    <div class="wrap navbar">
      <div class="logo"><span class="l-v1">V</span><span class="l-u">U</span><span class="l-v2">V</span><span class="l-a">A</span></div>
        <nav class="links">
  <a href="index.html" class="active">Home</a>
  <a href="table.html">Table</a>
  <a href="clubs.html">Clubs</a>
  <a href="players.html">Players</a>
  <a href="fixtures.html">Fixtures</a>
  <a href="market.html">Market Value</a>
  <a href="news.html">News</a>
  <a href="statistics.html">Statistics</a>
</nav>
    </div>
  </header>
  <main class="wrap" style="padding: 60px 24px 80px;">
    <h2 class="section-title">Fixtures &amp; results</h2>
    <p class="section-sub">Every match below comes straight from our own fixtures table — entered and updated through the admin panel.</p>
    <div class="card-grid" id="fixtures-grid"></div>
  </main>
  <script src="api.js"></script>
  <script>
    function fmtKickoff(iso) {
      const d = new Date(iso);
      return d.toLocaleDateString(undefined, { weekday: 'short', day: 'numeric', month: 'short' }) + ' · ' +
             d.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });
    }
    const STATUS_LABEL = {
      scheduled: 'Upcoming', live: 'Live', halftime: 'Half-time',
      fulltime: 'Full-time', postponed: 'Postponed', cancelled: 'Cancelled',
    };
    async function loadFixtures() {
      const grid = document.getElementById('fixtures-grid');
      try {
        const fixtures = await apiGet('/fixtures/');
        if (!fixtures.length) {
          grid.innerHTML = '<div class="detail-card"><div class="news-head">No fixtures yet</div><p class="news-body">Add fixtures from the admin panel to see them listed here.</p></div>';
          return;
        }
        grid.innerHTML = fixtures.map((f) => {
          const score = (f.status === 'fulltime' || f.status === 'live' || f.status === 'halftime')
            ? `${f.home_score} – ${f.away_score}` : 'vs';
          return `
            <article class="detail-card">
              <div class="news-tag">${escapeHtml(fmtKickoff(f.match_datetime))} · ${escapeHtml(STATUS_LABEL[f.status] || f.status)}</div>
              <div class="news-head">${escapeHtml(f.home_team.name)} ${escapeHtml(score)} ${escapeHtml(f.away_team.name)}</div>
              <p class="news-body">${escapeHtml(f.venue_name || 'Venue TBC')}${f.round_name ? ' · ' + escapeHtml(f.round_name) : ''}${f.matchweek ? ' · Matchweek ' + escapeHtml(String(f.matchweek)) : ''}</p>
            </article>`;
        }).join('');
      } catch (err) {
        grid.innerHTML = '<div class="detail-card"><div class="news-head">Backend offline</div><p class="news-body">Start the API with uvicorn main:app --reload to load fixtures.</p></div>';
      }
    }
    loadFixtures();
  </script>
</body>
</html>
